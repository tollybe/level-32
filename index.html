 document.getElementById('gate-form').addEventListener('submit', async(e)=>{
   e.preventDefault();const button=document.getElementById('enter');const error=document.getElementById('error');
   error.textContent='';button.disabled=true;button.textContent='DECRYPTING…';
   try{
     if(!crypto?.subtle)throw new Error('This page requires HTTPS (or localhost).');
     const pw=document.getElementById('password').value;
     const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
     const aesKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
     const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)},aesKey,decode(payload.ciphertext));
